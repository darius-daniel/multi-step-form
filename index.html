<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Multi-step form</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- Sidebar start -->
      <aside class="sidebar">
        <nav>
          <ul class="sidebar__nav">
            <li class="sidebar__navItem">
              <span class="navItem__marker">1</span>
              <div>
                <h2 class="navItem__title">Step 1</h2>
                <p class="navItem__description">Your info</p>
              </div>
            </li>

            <li class="sidebar__navItem">
              <span class="navItem__marker">2</span>
              <div>
                <h2 class="navItem__title">Step 2</h2>
                <p class="navItem__description">Select plan</p>
              </div>
            </li>

            <li class="sidebar__navItem">
              <span class="navItem__marker">3</span>
              <div>
                <h2 class="navItem__title">Step 3</h2>
                <p class="navItem__description">Add-ons</p>
              </div>
            </li>

            <li class="sidebar__navItem">
              <span class="navItem__marker">4</span>
              <div>
                <h2 class="navItem__title">Step 4</h2>
                <p class="navItem__description">Summary</p>
              </div>
            </li>
          </ul>
        </nav>
      </aside>
      <!-- Sidebar end -->

      <!-- Step 1 start -->
      <section class="step">
        <header class="step__header">
          <h1 class="step__title">Personal info</h1>
          <p class="step__description">
            Please provide your name, email address, and phone number.
          </p>
        </header>

        <form class="step__form" action="#">
          <fieldset class="fieldset">
            <label for="name" class="fieldset__label">Name</label>
            <input
              type="text"
              name="name"
              id="name"
              placeholder="e.g. Stephen King"
              class="fieldset__input"
            />
          </fieldset>

          <fieldset class="fieldset">
            <label for="email" class="fieldset__label">Email Address</label>
            <input
              type="email"
              name="email"
              id="email"
              placeholder="e.g. stephenking@lorem.com"
              class="fieldset__input"
            />
          </fieldset>

          <fieldset class="fieldset">
            <label for="phone" class="fieldset__label">Phone Number</label>
            <input
              type="tel"
              name="phone"
              id="phone"
              placeholder="e.g. +1 234 567 890 "
              class="fieldset__input"
            />
          </fieldset>
        </form>

        <button id="btn__next">Next Step</button>

        <!-- Step 1 end -->
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="https://github.com/darius-daniel">Darius Daniel</a>.
    </footer>
  </body>
</html>
