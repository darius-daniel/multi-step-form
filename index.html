<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Multi-step form</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
        margin-top: 1rem;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- Sidebar start -->
      <aside class="sidebar">
        <nav>
          <ul class="sidebar__nav">
            <li class="sidebar__navItem">
              <span class="navItem__marker">1</span>
              <div>
                <h2 class="navItem__title">Step 1</h2>
                <p class="navItem__description">Your info</p>
              </div>
            </li>

            <li class="sidebar__navItem">
              <span class="navItem__marker">2</span>
              <div>
                <h2 class="navItem__title">Step 2</h2>
                <p class="navItem__description">Select plan</p>
              </div>
            </li>

            <li class="sidebar__navItem">
              <span class="navItem__marker">3</span>
              <div>
                <h2 class="navItem__title">Step 3</h2>
                <p class="navItem__description">Add-ons</p>
              </div>
            </li>

            <li class="sidebar__navItem">
              <span class="navItem__marker">4</span>
              <div>
                <h2 class="navItem__title">Step 4</h2>
                <p class="navItem__description">Summary</p>
              </div>
            </li>
          </ul>
        </nav>
      </aside>
      <!-- Sidebar end -->

      <!-- Step 1 start -->
      <section class="step">
        <header class="step__header">
          <h1 class="step__title"></h1>
          <p class="step__description"></p>
        </header>

        <!-- Main part is dynamically generated by a JS script -->

        <footer class="step__footer">
          <button id="btn__prev">Go Back</button>
          <button id="btn__next" type="submit">Next Step</button>
        </footer>

        <!-- Step 1 end -->
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="https://github.com/darius-daniel">Darius Daniel</a>.
    </footer>
  </body>
</html>
